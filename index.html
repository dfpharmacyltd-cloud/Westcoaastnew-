<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TBS Dossier Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"></script>
<style>
:root{
  --ink:#16213E; --ink2:#3C4A66; --muted:#6B778F; --line:#DCE1EA; --line2:#EDF0F5;
  --paper:#FFFFFF; --wash:#F6F7FB; --indigo:#3434C8; --indigo2:#EEF0FF; --indigo3:#C9CCF6;
  --ok:#1D7A4B; --okbg:#E5F4EC; --warn:#9A5B00; --warnbg:#FFF3DC; --bad:#B42318; --badbg:#FDECEA;
  --out:#A4460E; --outbg:#FCEBDD; --na:#5F6778; --nabg:#EEF0F3;
  --side:#16213E; --sidefg:#C7CFE0;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#E6EAF3;--ink2:#C3CBDB;--muted:#8E99B0;--line:#2D3752;--line2:#222B41;--paper:#111829;--wash:#172035;--indigo:#7C82FF;--indigo2:#1C2244;--indigo3:#3A4180;--ok:#5FD39A;--okbg:#12301F;--warn:#F2C265;--warnbg:#33280F;--bad:#FF8A80;--badbg:#3A1714;--out:#F4A36B;--outbg:#3A2210;--na:#A7B0C2;--nabg:#232C42;--side:#0B1120}}
:root[data-theme="dark"]{--ink:#E6EAF3;--ink2:#C3CBDB;--muted:#8E99B0;--line:#2D3752;--line2:#222B41;--paper:#111829;--wash:#172035;--indigo:#7C82FF;--indigo2:#1C2244;--indigo3:#3A4180;--ok:#5FD39A;--okbg:#12301F;--warn:#F2C265;--warnbg:#33280F;--bad:#FF8A80;--badbg:#3A1714;--out:#F4A36B;--outbg:#3A2210;--na:#A7B0C2;--nabg:#232C42;--side:#0B1120}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--paper);color:var(--ink);font:15px/1.5 "Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--indigo)}
:focus-visible{outline:2px solid var(--indigo);outline-offset:2px}
.app{display:grid;grid-template-columns:232px 1fr;height:100%}
aside{background:var(--side);color:var(--sidefg);display:flex;flex-direction:column;padding:18px 12px;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 20px;color:#fff}
.brand svg{flex:none}
.brand b{display:block;font-size:15px;letter-spacing:.2px}
.brand small{display:block;font-size:12px;color:#94A0BA}
nav button{display:flex;width:100%;gap:10px;align-items:center;background:none;border:0;color:var(--sidefg);padding:9px 10px;border-radius:6px;cursor:pointer;text-align:left;font-size:14px}
nav button:hover{background:rgba(255,255,255,.06);color:#fff}
nav button[aria-current="page"]{background:rgba(120,130,255,.18);color:#fff;box-shadow:inset 3px 0 0 #8C92FF}
nav .count{margin-left:auto;font-size:12px;background:rgba(255,255,255,.1);padding:0 7px;border-radius:9px}
.side-foot{margin-top:auto;font-size:12px;color:#8894AE;padding:12px 8px 0;line-height:1.45}
main{overflow:auto;background:var(--paper)}
.topbar{display:none}
.wrap{max-width:1180px;margin:0 auto;padding:28px 32px 60px}
h1{font-size:26px;line-height:1.2;margin:0 0 4px;font-weight:700;letter-spacing:-.2px}
h2{font-size:18px;margin:28px 0 10px;font-weight:600}
h3{font-size:15px;margin:18px 0 8px;font-weight:600}
.sub{color:var(--muted);margin:0 0 20px;max-width:70ch}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--paper);padding:8px 14px;border-radius:7px;cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap}
.btn:hover{border-color:#B8C0D0;background:var(--wash)}
.btn.primary{background:var(--indigo);border-color:var(--indigo);color:#fff}
.btn.primary:disabled{background:var(--indigo)}
.btn.primary:hover:not(:disabled){filter:brightness(.9)}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.stats{display:grid;grid-template-columns:repeat(5,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:6px 0 26px}
.stat{padding:16px 18px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat .n{font-size:28px;font-weight:700;line-height:1.1}
.stat .l{font-size:13px;color:var(--muted)}
.stat.go .n{color:var(--ok)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.card{border:1px solid var(--line);border-radius:10px;padding:18px;background:var(--paper)}
.dcard h3{margin:0 0 2px;font-size:17px}
.dcard .meta{color:var(--muted);font-size:13px}
.bar{height:8px;background:var(--line2);border-radius:5px;overflow:hidden;margin:12px 0 6px}
.bar i{display:block;height:100%;background:var(--indigo);border-radius:5px;transition:width .4s}
.kv3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:12px 0 14px;font-size:13px}
.kv3 b{display:block;font-size:18px}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:5px;white-space:nowrap;letter-spacing:.1px}
.b-AVAILABLE,.b-VALID,.b-CURRENT{background:var(--okbg);color:var(--ok)}
.b-SUPPORTING,.b-EXPIRING{background:var(--warnbg);color:var(--warn)}
.b-PENDING,.b-EXPIRED,.b-CONFLICT,.b-critical{background:var(--badbg);color:var(--bad)}
.b-OUTDATED,.b-OVERDUE,.b-major{background:var(--outbg);color:var(--out)}
.b-NA,.b-NOEXP,.b-minor,.b-RECOMMENDED{background:var(--nabg);color:var(--na)}
.b-minor{background:var(--warnbg);color:var(--warn)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:600;color:var(--ink2);background:var(--wash);border-bottom:1px solid var(--line);padding:8px 10px;white-space:nowrap}
td{border-bottom:1px solid var(--line2);padding:8px 10px;vertical-align:top}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.tablewrap table tr:last-child td{border-bottom:0}
.muted{color:var(--muted)}
.small{font-size:12.5px}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:18px 0 18px;overflow-x:auto}
.tabs button{background:none;border:0;padding:10px 14px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--indigo);border-bottom-color:var(--indigo)}
.drop{border:2px dashed var(--indigo3);background:var(--indigo2);border-radius:12px;padding:34px;text-align:center;cursor:pointer;transition:background .15s}
.drop.over{background:var(--indigo3);border-color:var(--indigo)}
.drop b{display:block;font-size:17px;margin-bottom:4px}
.field{display:block;margin:0 0 14px}
.field span{display:block;font-size:13px;font-weight:600;color:var(--ink2);margin-bottom:5px}
.input{width:100%;border:1px solid var(--line);border-radius:7px;padding:9px 11px;background:var(--paper)}
textarea.input{min-height:64px;resize:vertical;line-height:1.45}
.input:focus{border-color:var(--indigo);outline:none;box-shadow:0 0 0 3px rgba(52,52,200,.15)}
.uplist{margin-top:14px;display:grid;gap:6px}
.up{display:grid;grid-template-columns:1fr 90px 140px;gap:12px;align-items:center;font-size:13.5px;border:1px solid var(--line2);border-radius:7px;padding:7px 10px}
.up .pb{height:5px;background:var(--line2);border-radius:3px;overflow:hidden}.up .pb i{display:block;height:100%;background:var(--ok)}
/* Filing index: the signature element */
.index{border:1px solid var(--line);border-radius:10px;overflow:hidden}
.ix{display:grid;grid-template-columns:8px 64px 1fr auto;align-items:center;gap:12px;padding:10px 14px 10px 0;border-bottom:1px solid var(--line2);font-size:14px}
.ix:last-child{border-bottom:0}
.ix .edge{align-self:stretch;background:var(--line)}
.ix.s-AVAILABLE .edge{background:var(--ok)}.ix.s-SUPPORTING .edge{background:#E0A526}.ix.s-PENDING .edge,.ix.s-EXPIRED .edge,.ix.s-CONFLICT .edge{background:var(--bad)}.ix.s-OUTDATED .edge{background:#D9772B}
.ix .code{font-weight:700;color:var(--ink2);font-size:13px}
.ix .files{font-size:12.5px;color:var(--muted)}
.ix.child .code{padding-left:14px;font-weight:500;color:var(--muted)}
.log{font-size:13px;background:var(--wash);border:1px solid var(--line);border-radius:8px;padding:10px 12px;max-height:240px;overflow:auto;white-space:pre-wrap}
.analysis-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:14px 0}
.analysis-grid div{padding:12px 14px;border-right:1px solid var(--line)}
.analysis-grid div:last-child{border-right:0}
.analysis-grid b{display:block;font-size:22px}
.analysis-grid span{font-size:12.5px;color:var(--muted)}
.conf{border:1px solid var(--line);border-left:4px solid var(--bad);border-radius:8px;padding:12px 14px;margin:0 0 10px}
.conf.major{border-left-color:#D9772B}.conf.minor{border-left-color:#E0A526}
.conf dl{display:grid;grid-template-columns:110px 1fr;gap:4px 12px;margin:8px 0 0;font-size:13.5px}
.conf dt{color:var(--muted)}
.conf dd{margin:0}
.chat{display:flex;flex-direction:column;height:520px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.msgs{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--wash)}
.msg{max-width:80%;padding:9px 12px;border-radius:10px;white-space:pre-wrap;font-size:14px}
.msg.u{align-self:flex-end;background:var(--indigo);color:#fff}
.msg.a{align-self:flex-start;background:var(--paper);border:1px solid var(--line)}
.chatin{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:8px 10px 0}
.chip{font-size:12.5px;border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:3px 10px;cursor:pointer}
.notice{border:1px solid var(--indigo3);background:var(--indigo2);border-radius:8px;padding:10px 14px;font-size:13.5px;margin:0 0 16px}
.notice.warn{border-color:#F0CF8E;background:var(--warnbg)}
.notice.bad{border-color:#F2B8B2;background:var(--badbg)}
.empty{text-align:center;padding:48px 20px;border:1px dashed var(--line);border-radius:12px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}
.modal{position:fixed;inset:0;background:rgba(22,33,62,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.modal .box{background:var(--paper);border-radius:12px;max-width:900px;width:100%;max-height:90%;overflow:auto;padding:22px}
.preview canvas,.preview img{max-width:100%;border:1px solid var(--line);margin-bottom:10px;display:block}
.toast{position:fixed;right:20px;bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:14px;z-index:60;max-width:420px}
select.input{padding:7px 9px;min-width:120px}
.ingr input{border:1px solid transparent;background:transparent;padding:4px 6px;border-radius:5px;width:100%;min-width:60px}
.ingr input:hover{border-color:var(--line)}
.ingr input:focus{border-color:var(--indigo);background:var(--paper);outline:none}
.kvform{display:grid;grid-template-columns:260px 1fr;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kvform>div{padding:10px 14px;border-bottom:1px solid var(--line2)}
.kvform>div:nth-child(odd){background:var(--wash);font-weight:600;font-size:13.5px;color:var(--ink2)}
.kvform textarea{min-height:40px}
.src{font-size:12px;color:var(--muted);margin-top:3px}
.na{color:var(--bad);font-style:italic}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;inset:0 30% 0 0;z-index:40;transform:translateX(-102%);transition:transform .2s;padding-top:calc(18px + env(safe-area-inset-top,0px))}
  aside.open{transform:none}
  .topbar{display:flex;position:sticky;top:0;z-index:30;background:var(--side);color:#fff;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top,0px));align-items:center;gap:10px}
  .topbar button{background:none;border:0;color:#fff;font-size:20px}
  .wrap{padding:18px 16px 50px}
  .stats{grid-template-columns:repeat(2,1fr)}.stat{border-bottom:1px solid var(--line)}
  .analysis-grid{grid-template-columns:repeat(3,1fr)}
  .kvform{grid-template-columns:1fr}
  .up{grid-template-columns:1fr 70px}.up .st{display:none}
  .ix{grid-template-columns:6px 52px 1fr}.ix>:last-child{grid-column:3}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="app">

<script>
/* Deployment shim: provides window.claude.use("sample"|"downloads") backed by /api/claude (Anthropic API via Vercel function). */
(function(){
  "use strict";
  const PW_KEY="tbs_app_password";
  let healthP=null;
  function health(){ if(!healthP) healthP=fetch("/api/claude",{cache:"no-store"}).then(r=>r.ok?r.json():null).catch(()=>null); return healthP; }
  function tolerantJSON(t){ t=String(t||"").trim(); try{return JSON.parse(t);}catch{}
    const f=t.match(/```(?:json)?\s*([\s\S]*?)```/); if(f){ try{return JSON.parse(f[1]);}catch{} }
    const a=Math.min(...["{","["].map(c=>{const i=t.indexOf(c);return i<0?Infinity:i;})); const b=Math.max(t.lastIndexOf("}"),t.lastIndexOf("]"));
    if(a<Infinity&&b>a){ try{return JSON.parse(t.slice(a,b+1));}catch{} } return undefined; }
  function b64(blob){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(String(r.result).split(",")[1]); r.onerror=()=>rej(r.error); r.readAsDataURL(blob); }); }
  async function shrink(blob,maxW,q){ try{ const bmp=await createImageBitmap(blob); const sc=Math.min(1,maxW/Math.max(bmp.width,bmp.height)); const c=document.createElement("canvas"); c.width=Math.round(bmp.width*sc); c.height=Math.round(bmp.height*sc); const x=c.getContext("2d"); x.fillStyle="#fff"; x.fillRect(0,0,c.width,c.height); x.drawImage(bmp,0,0,c.width,c.height); return await new Promise(r=>c.toBlob(b=>r(b||blob),"image/jpeg",q)); }catch{ return blob; } }
  async function build(input,opts){ const messages=typeof input==="string"?[{role:"user",content:input}]:input.map(m=>({role:m.role,content:m.content}));
    const images=[]; if(opts&&opts.images){ const arr=opts.images instanceof Blob?[opts.images]:Array.from(opts.images); for(const bl of arr.slice(0,8)){ images.push({media_type:"image/jpeg",data:await b64(await shrink(bl,1400,.78))}); } }
    const size=()=>images.reduce((a,i)=>a+i.data.length,0)+JSON.stringify(messages).length;
    while(size()>4000000 && images.length) images.pop();   /* Vercel request body limit is 4.5 MB */
    return {messages,images,tier:(opts&&opts.modelTier)||"default"}; }
  async function call(payload,signal,retried){
    if(signal&&signal.aborted) throw {code:"cancelled",message:"cancelled"};
    let r; try{ r=await fetch("/api/claude",{method:"POST",headers:{"content-type":"application/json","x-app-password":localStorage.getItem(PW_KEY)||""},body:JSON.stringify(payload),signal}); }
    catch(e){ throw {code:signal&&signal.aborted?"cancelled":"upstream_error",message:String(e&&e.message||e)}; }
    const d=await r.json().catch(()=>({}));
    if(r.status===401 && !retried){ const p=window.prompt("Enter the app password to use AI analysis:"); if(p){ localStorage.setItem(PW_KEY,p); return call(payload,signal,true); } }
    if(!r.ok) throw {code:d.code||(r.status===504?"timeout":"upstream_error"),message:d.message||("HTTP "+r.status)};
    return d; }
  async function sample(input,opts={}){ const p=await build(input,opts); const d=await call(p,opts.signal); if(typeof opts.onText==="function"&&d.text) opts.onText({text:d.text,delta:d.text}); return {text:d.text,truncated:!!d.truncated,modelTierApplied:p.tier}; }
  sample.json=async(input,opts={})=>{ const p=await build(input,opts); p.json=true; const d=await call(p,opts.signal); const v=tolerantJSON(d.text); if(v===undefined) throw {code:"invalid_json",message:"Reply was not JSON",text:d.text}; return v; };
  sample.limits=async()=>({maxPromptBytes:200000,images:{maxCount:8,maxInputBytes:20000000,mediaTypes:["image/jpeg","image/png","image/webp"]}});
  const downloads={save:async({filename,data})=>{ const blob=data instanceof Blob?data:new Blob([data]); const u=URL.createObjectURL(blob); const a=document.createElement("a"); a.href=u; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u),60000); }};
  window.TBS_DEPLOYED=true; window.TBS_PW_KEY=PW_KEY;
  window.claude={use:async name=>{ if(name==="downloads") return downloads; if(name==="sample"){ const h=await health(); return h&&h.keyConfigured?sample:null; } return null; }};
})();
</script>
<script>

/* ================= constants ================= */

const PROMPT_BUDGET = 180000;

  {code:"1.7.3",label:"Stability Data / Commitment Letter",folder:"1.7_Additional_Attachments/1.7.3_Stability_Data_and_Commitment_Letter",file:"Stability_Data",req:"Stability data and stability commitment letter",add:true},

const LABEL_SUBS = ["Carton","Blister_Foil","Pack_Insert","Inner_Label","Outer_Label"];
const SUB_FILE = {Carton:"Carton_Artwork",Blister_Foil:"Blister_Foil_Artwork",Pack_Insert:"Pack_Insert",Inner_Label:"Inner_Label",Outer_Label:"Outer_Label"};
const FORM_FIELDS = [
  ["1.2","Product / Common Name"],["1.3","Product Type"],["1.4.1","Type of Packaging Container"],["1.4.2","Retail Packaging Unit(s)"],
  ["1.4.3","Shelf Life (Months)"],["1.4.4","Shelf Life After Opening Container"],["1.4.5","Instruction for User"],["1.4.6","Recommended Storage Condition"],
  ["1.4.7","Country of Origin"],["1.4.8","Region Where Company Operates"],["1.5.1","Brand Name"],
  ["3.1","Company Name of Manufacturer"],["3.2.1","Mobile Number"],["3.2.2","Email Address"],["3.2.3","Postal Address"],
  ["3.2.4","Country Where Product Was Manufactured"],["3.2.5","City"],["3.2.6","Street"],["3.x","Additional Manufacturer Information"]
];

const fmtD = iso => { if(!iso) return "—"; const m=String(iso).match(/^(\d{4})-(\d{2})(?:-(\d{2}))?/); if(!m) return esc(iso); return (m[3]?m[3]+"/":"")+m[2]+"/"+m[1]; };
const fmtPlain = iso => { const m=String(iso||"").match(/^(\d{4})-(\d{2})(?:-(\d{2}))?/); if(!iso) return "—"; if(!m) return String(iso); return (m[3]?m[3]+"/":"")+m[2]+"/"+m[1]; };
function parseISO(s, end){ const m=String(s||"").match(/^(\d{4})-(\d{2})(?:-(\d{2}))?$/); if(!m) return null;
  if(m[3]) return new Date(+m[1],+m[2]-1,+m[3]); return end? new Date(+m[1],+m[2],0) : new Date(+m[1],+m[2]-1,1); }
const daysBetween = (a,b) => Math.round((b-a)/86400000);

const bytesOf = s => new TextEncoder().encode(s).length;
function clipBytes(s,max){ if(bytesOf(s)<=max) return s; let lo=0,hi=s.length; while(lo<hi){const mid=(lo+hi+1)>>1; if(bytesOf(s.slice(0,mid))<=max) lo=mid; else hi=mid-1;} return s.slice(0,lo)+"\n[...content truncated...]"; }
async function sha256(blob){ try{ const h=await crypto.subtle.digest("SHA-256",await blob.arrayBuffer()); return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,"0")).join(""); }catch{ return "n/a"; } }

let DBH=null;
function openDB(){ return new Promise((res,rej)=>{ let r; try{ r=indexedDB.open("tbs-dossier-builder",1);}catch(e){return rej(e);} 
  r.onupgradeneeded=()=>{ const d=r.result; if(!d.objectStoreNames.contains("projects")) d.createObjectStore("projects",{keyPath:"id"});
    if(!d.objectStoreNames.contains("files")){ const s=d.createObjectStore("files",{keyPath:"id"}); s.createIndex("pid","pid"); }
    if(!d.objectStoreNames.contains("kv")) d.createObjectStore("kv",{keyPath:"k"}); };
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
function tx(store,mode,fn){ return new Promise((res,rej)=>{ try{ const t=DBH.transaction(store,mode); const s=t.objectStore(store); const out=fn(s); t.oncomplete=()=>res(out&&out.result!==undefined?out.result:out); t.onerror=()=>rej(t.error);}catch(e){rej(e);} }); }
const idbPut=(st,o)=>tx(st,"readwrite",s=>s.put(o));
const idbDel=(st,k)=>tx(st,"readwrite",s=>s.delete(k));
const idbGet=(st,k)=>new Promise((res,rej)=>{try{const r=DBH.transaction(st).objectStore(st).get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);}catch(e){rej(e)}});
const idbAll=(st)=>new Promise((res,rej)=>{try{const r=DBH.transaction(st).objectStore(st).getAll();r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error);}catch(e){rej(e)}});
const idbFiles=(pid)=>new Promise((res,rej)=>{try{const r=DBH.transaction("files").objectStore("files").index("pid").getAll(pid);r.onsuccess=()=>res(r.result||[]);r.onerror=()=>rej(r.error);}catch(e){rej(e)}});

if(window.pdfjsLib){ pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; }
function canvasBlob(c,q=.85){ return new Promise(r=>c.toBlob(b=>r(b),"image/jpeg",q)); }
async function renderPdfPage(pdf,n,maxW=1500){ const page=await pdf.getPage(n); const v1=page.getViewport({scale:1}); const sc=Math.min(2.2,maxW/v1.width); const vp=page.getViewport({scale:sc});
  const c=document.createElement("canvas"); c.width=Math.ceil(vp.width); c.height=Math.ceil(vp.height); const ctx=c.getContext("2d"); ctx.fillStyle="#fff"; ctx.fillRect(0,0,c.width,c.height);
  await page.render({canvasContext:ctx,viewport:vp}).promise; return c; }
async function downscaleImage(blob,maxW=1800){ try{ const bmp=await createImageBitmap(blob); const sc=Math.min(1,maxW/Math.max(bmp.width,bmp.height)); const c=document.createElement("canvas"); c.width=Math.round(bmp.width*sc); c.height=Math.round(bmp.height*sc); c.getContext("2d").drawImage(bmp,0,0,c.width,c.height); return await canvasBlob(c,.88);}catch{ return blob; } }
async function extractContent(rec){
  const ext=extOf(rec.name); const ab=await rec.blob.arrayBuffer(); const maxImg=Math.min(S.settings.maxImages, LIMITS?.images?.maxCount||0);
  if(ext==="pdf"){
    if(!window.pdfjsLib) throw new Error("PDF reader failed to load");
    const pdf=await pdfjsLib.getDocument({data:new Uint8Array(ab)}).promise; const pages=pdf.numPages; let text=""; const per=[];
    for(let i=1;i<=pages;i++){ const pg=await pdf.getPage(i); const tc=await pg.getTextContent(); let t=""; for(const it of tc.items){ t+=it.str+(it.hasEOL?"\n":" "); } t=t.replace(/[ \t]+/g," ").trim(); per.push(t.length); text+=`\n--- Page ${i} of ${pages} ---\n`+t; }
    const images=[]; const imgPages=[];
    if(maxImg>0){ const cand=[]; for(let i=1;i<=pages;i++){ if(pages<=3 || per[i-1]<120) cand.push(i); }
      for(const n of cand.slice(0,maxImg)){ const c=await renderPdfPage(pdf,n); images.push(await canvasBlob(c)); imgPages.push(n); } }
    const scanned = per.filter(x=>x<120).length;
    return {text,pages,images,imgPages,note:`PDF, ${pages} page(s); ${scanned} page(s) with little or no extractable text${images.length?`; images attached for page(s) ${imgPages.join(", ")} (read them visually, OCR any text)`:""}.`};
  }
  if(ext==="docx"){ const r=await mammoth.extractRawText({arrayBuffer:ab}); return {text:r.value,pages:null,images:[],note:"Word document (text extracted)."}; }
  if(ext==="xlsx"||ext==="xls"){ const wb=XLSX.read(ab,{type:"array"}); let t=""; for(const n of wb.SheetNames){ t+=`\n--- Sheet: ${n} ---\n`+XLSX.utils.sheet_to_csv(wb.Sheets[n]); } return {text:t,pages:null,images:[],note:`Spreadsheet, ${wb.SheetNames.length} sheet(s) (as CSV).`}; }
  if(["jpg","jpeg","png","webp"].includes(ext)){ if(!maxImg) return {text:"",images:[],note:"Image file, but image reading is not available in this view."}; return {text:"",pages:1,images:[await downscaleImage(rec.blob)],note:"Image file attached; read it visually and OCR all text."}; }
  if(ext==="txt"||ext==="csv"){ return {text:new TextDecoder().decode(ab),images:[],note:"Plain text."}; }
  return {text:"",images:[],note:"Unsupported format."};
}

function docPrompt(p,d,c){ return `You are a meticulous regulatory document analyst preparing a Tanzania Bureau of Standards (TBS) food supplement dossier.
Target product entered by the user: "${p.name}"
Today's date: ${todayISO()}
File name: ${d.name}  (do NOT classify from the file name alone - read the content)
Content note: ${c.note}

Classify this ONE document into exactly one dossier point:

1.6.4 GMP certificate or GMP compliance evidence
1.6.5 Free Sale Certificate

1.7.1 finished product specification and/or method of analysis

1.7.3 stability data and/or stability commitment letter

- Dates as "YYYY-MM-DD", or "YYYY-MM" when only month and year are given. If validity is relative (e.g. "re-inspection two years from the date of this letter"), compute expiry_date and explain in validity_text.
- is_formal_certificate (only for certificate-type documents): false if the document says it is not a certificate/licence (quote that sentence in certificate_disclaimer) or it is only a letter/report.
- matches_target_product: "no" if the document is for a different product (different name, strength or composition than the target), "yes" if it is the target, "unclear" if uncertain, "not_product_specific" for site-level documents (SMF, GMP, licences).
- ingredients: list EVERY ingredient shown (actives and excipients) with quantity per unit as written.
- sub_documents: if the file contains several distinct documents (e.g. stability report plus commitment letter), list them with page numbers.

Reply with ONLY one JSON object in this shape:
${DOC_SCHEMA}

DOCUMENT CONTENT (extracted text${c.images.length?"; page images are attached":""}):
`; }
async function analyzeDoc(p,d,rec,signal){
  const c=await extractContent(rec);
  d.pages=c.pages||d.pages; d.textChars=c.text.length;
  const head=docPrompt(p,d,c); const budget=PROMPT_BUDGET-bytesOf(head);
  const body=clipBytes(c.text.trim()||"(no extractable text - rely on the attached images)",budget);
  if(!c.text.trim() && !c.images.length) throw new Error("No readable content (and image reading unavailable).");
  const opts={modelTier:S.settings.tier,signal}; if(c.images.length) opts.images=c.images;
  const r=await SAMPLE.json(head+body,opts);
  if(!r||typeof r!=="object") throw {code:"invalid_json"};
  return r;
}

Reply with ONLY this JSON:
{"form":{"1.2":{"value":"","sources":[""]}},"ingredients":[{"name":"","unit":"","value":"","proportion_label":"","proportion_unit":"","proportion_value":"","purpose":"","source":""}],"conflicts":[{"severity":"critical|major|minor","field":"","doc_a":"","value_a":"","doc_b":"","value_b":"","action":""}],"observations":[""],"summary":""}

${data}`; }
async function consolidate(p,signal){
  let data=compactAnalysis(p); let s=JSON.stringify(data);
  const headBytes=bytesOf(consPrompt(p,"")); const room=PROMPT_BUDGET-headBytes;
  if(bytesOf(s)>room){ data=data.map(o=>{ const x={...o}; delete x.issues; delete x.sub_docs; if(x.point!=="1.7.2"&&x.point!=="1.6.1") delete x.ingredients; if(x.facts&&x.facts.instructions_for_use) x.facts={...x.facts,instructions_for_use:String(x.facts.instructions_for_use).slice(0,500)}; return x;}); s=JSON.stringify(data); }

/* ================= deterministic validation ================= */
function effOf(d){ const a=d.analysis||{}; const o=d.override||{};
  let point=o.point||a.dossier_point||"UNCLASSIFIED"; let sub=o.sub!==undefined?o.sub:a.label_subtype; if(point==="1.6.1"&&!LABEL_SUBS.includes(sub)) sub="Outer_Label"; if(point!=="1.6.1") sub=null;
  return {point, sub, match:o.match||a.matches_target_product||"unclear", other:o.other||a.other_category||"Other Supporting Document", formal:a.is_formal_certificate}; }
function validityOf(d){ const a=d.analysis; if(!a) return null; const t=todayD(); const win=S.settings.expiryDays;
  const out={issue:a.issue_date||a.review_date||null, expiry:a.expiry_date||null, next:a.next_review_date||null, batchExp:a.batch_expiry||null, status:"NO EXPIRY STATED", key:"NOEXP", note:a.validity_text||""};
  const ex=parseISO(out.expiry,true), nx=parseISO(out.next,true);
  if(ex){ const dl=daysBetween(t,ex); if(dl<0){out.status="EXPIRED";out.key="EXPIRED";out.left=`expired ${-dl} days ago`;} else if(dl<=win){out.status="EXPIRING SOON";out.key="EXPIRING";out.left=`${dl} days left`;} else {out.status="VALID";out.key="VALID";out.left=`${dl} days left`;} }
  if(nx){ const dl=daysBetween(t,nx); if(dl<0 && out.key!=="EXPIRED"){out.status="REVIEW OVERDUE";out.key="OVERDUE";out.left=`review overdue by ${-dl} days`;} else if(!ex){ out.status=dl<=win?"EXPIRING SOON":"VALID"; out.key=dl<=win?"EXPIRING":"VALID"; out.left=`review in ${dl} days`; } }
  const be=parseISO(out.batchExp,true); if(be && !ex){ const dl=daysBetween(t,be); out.status = dl<0?"EXPIRED":dl<=win?"EXPIRING SOON":"VALID"; out.key=dl<0?"EXPIRED":dl<=win?"EXPIRING":"VALID"; out.left=dl<0?`batch expired ${-dl} days ago`:`batch expires in ${dl} days`; }
  return out; }
function compute(p){
  const docs=p.docs.filter(d=>d.kind!=="container");
  const analysed=docs.filter(d=>d.analysis);
  const usable=analysed.filter(d=>{const e=effOf(d); return d.include!==false && e.match!=="no" && e.point!=="UNCLASSIFIED";});
  const mism=analysed.filter(d=>effOf(d).match==="no" || d.include===false);
  const unclassified=analysed.filter(d=>effOf(d).point==="UNCLASSIFIED" && effOf(d).match!=="no");
  const byPoint=(pt,subs)=>usable.filter(d=>{const e=effOf(d); return e.point===pt && (!subs||subs.includes(e.sub));});
  const mismFor=(pt,subs)=>mism.filter(d=>{const e=effOf(d); return e.point===pt && (!subs||subs.includes(e.sub));});
  const crit=new Set(); (p.conflicts||[]).filter(c=>c.severity==="critical").forEach(c=>{crit.add(c.doc_a);crit.add(c.doc_b);});
  const rows=[];
  function mk(code,label,list,required,opts={}){
    let status,key,remarks=[]; const vs=list.map(validityOf).filter(Boolean);
    if(!list.length){ const m=mismFor(code,opts.subs); status=required?"PENDING":(opts.optional?"NOT APPLICABLE":"PENDING"); key=required?"PENDING":(opts.optional?"NA":"RECOMMENDED");
      if(!required&&!opts.optional) remarks.push("Recommended - not uploaded"); if(opts.optional) remarks.push("Optional - not uploaded");
      if(m.length) remarks.push("Uploaded file(s) belong to another product or were excluded: "+m.map(x=>x.name).join(", "));
      if(required&&!m.length) remarks.push("Not available in uploaded documents"); }
    else { status="AVAILABLE"; key="AVAILABLE";
      if(code==="1.6.4" && list.every(d=>effOf(d).formal===false)){ status="AVAILABLE – SUPPORTING DOCUMENT"; key="SUPPORTING"; remarks.push("Formal GMP Certificate not identified"); const dis=list.map(d=>d.analysis.certificate_disclaimer).filter(Boolean)[0]; if(dis) remarks.push('Document states: "'+dis+'"'); }
      if(vs.some(v=>v.key==="OVERDUE")){ status="OUTDATED"; key="OUTDATED"; remarks.push("Review date passed"); }
      if(vs.some(v=>v.key==="EXPIRED")){ status="EXPIRED"; key="EXPIRED"; remarks.push("Expired"); }
      if(vs.some(v=>v.key==="EXPIRING")) remarks.push("Expiring soon");
      if(key==="AVAILABLE" && list.some(d=>crit.has(d.name))){ status="CONFLICT"; key="CONFLICT"; remarks.push("Critical conflict - see conflict report"); }
      list.forEach(d=>(d.analysis.issues||[]).slice(0,2).forEach(i=>remarks.push(i))); }
    const exp=vs.map(v=>v.expiry||v.next||v.batchExp).filter(Boolean)[0]||null;
    rows.push({code,label,files:list,status,key,required,remarks,expiry:exp,folder:opts.folder,sub:opts.sub,pend:opts.pend});
  }
  mk("1.6.1","Outer label / Carton",byPoint("1.6.1",["Carton","Outer_Label"]),true,{subs:["Carton","Outer_Label"],folder:"1.6.1_Product_Label/Outer_Label",pend:"Outer label / carton artwork for the target product"});
  mk("1.6.1","Inner label / Blister foil",byPoint("1.6.1",["Blister_Foil","Inner_Label"]),true,{subs:["Blister_Foil","Inner_Label"],folder:"1.6.1_Product_Label/Inner_Label",pend:"Inner label / blister foil (or container label) artwork for the target product"});
  mk("1.6.1","Pack insert",byPoint("1.6.1",["Pack_Insert"]),false,{subs:["Pack_Insert"],optional:true});

/* ================= analysis runner ================= */
async function runAnalysis(p,{force=false}={}){
  if(!AI_READY){ toast("AI is unavailable in this view. Check the server's ANTHROPIC_API_KEY."); return; }
  if(S.running) return;
  const ctl=new AbortController(); S.running={pid:p.id,ctl,done:0,total:0,phase:"Reading documents"}; S.log=[];
  const log=m=>{ S.log.push(new Date().toLocaleTimeString()+"  "+m); renderIfDossier(); };
  const files=await idbFiles(p.id); const fmap=Object.fromEntries(files.map(f=>[f.id,f]));
  const todo=p.docs.filter(d=>d.kind!=="container" && (force||!d.analysis));
  S.running.total=todo.length; let added=todo.length;
  try{
    for(const d of todo){
      if(ctl.signal.aborted) throw {code:"cancelled"};
      d.status="analyzing"; d.error=null; log(`Reading and analysing ${d.name}…`); renderIfDossier();
      try{ d.analysis=await analyzeDoc(p,d,fmap[d.id],ctl.signal); d.status="done"; d.analyzedAt=Date.now(); const e=effOf(d); log(`✓ ${d.name} → ${e.point}${e.sub?" / "+e.sub:""}${e.match==="no"?" (different product)":""}`); }
      catch(e){ if(e&&e.code==="cancelled") throw e; d.status="error"; d.error=e&&e.code?aiErr(e):(e&&e.message)||"Failed"; log(`✗ ${d.name}: ${d.error}`); if(e&&(e.code==="not_granted"||e.code==="rate_limited")) throw e; }
      S.running.done++; await saveProject(p);
    }
    if(p.docs.some(d=>d.analysis)){
      S.running.phase="Cross-checking documents"; log("Cross-checking all documents, extracting form, composition and conflicts…"); renderIfDossier();
      const r=await consolidate(p,ctl.signal);
      if(r&&r.form){ for(const [k,v] of Object.entries(r.form)){ if(!p.formEdited[k]) p.form[k]=v; } }
      if(Array.isArray(r.ingredients) && !p.ingredientsEdited) p.ingredients=r.ingredients;
      p.conflicts=Array.isArray(r.conflicts)?r.conflicts:[]; p.observations=Array.isArray(r.observations)?r.observations:[]; p.summary=r.summary||"";
      log(`✓ Form extracted; ${p.conflicts.length} conflict(s), ${p.observations.length} observation(s).`);
    }
    p.analyzedAt=Date.now(); p.stale=true; p.version=(p.version||0)+1;
    const c=compute(p); p.versions.push({n:p.version,date:Date.now(),note:force?"Full re-analysis":`Analysed ${added} new document(s)`,docs:c.docs.length,pending:c.pending.length,warnings:c.warnings,progress:c.progress,snapshot:snapshotOf(p)});
    await saveProject(p); log("Validation complete. Generate the ZIP when ready."); toast("Analysis complete – version "+p.version);
  }catch(e){ log("Stopped: "+aiErr(e)); p.docs.forEach(d=>{ if(d.status==="analyzing") d.status=d.analysis?"done":"uploaded"; }); await saveProject(p); toast(aiErr(e)); }
  finally{ S.running=null; if(S.view==="new"&&S.pid===p.id){ S.view="dossier"; S.tab="Overview"; } render(); }
}

/* ================= uploads ================= */
async function addFiles(p,fileList){
  const list=[...fileList]; if(!list.length) return;
  S.uploads=list.map(f=>({name:f.name,size:f.size,pct:0,state:"Queued"})); render();
  const existing=new Set(p.docs.map(d=>d.name+"|"+d.size));
  for(let i=0;i<list.length;i++){ const f=list[i]; const u=S.uploads[i]; const ext=extOf(f.name);
    if(!ACCEPT.includes(ext)){ u.state="Rejected: file type"; u.bad=true; render(); continue; }
    if(f.size>MAX_FILE){ u.state="Rejected: over 60 MB"; u.bad=true; render(); continue; }
    if(existing.has(f.name+"|"+f.size)){ u.state="Skipped: already uploaded"; u.pct=100; render(); continue; }
    u.state="Uploading"; render();
    const blob=await readWithProgress(f,pct=>{u.pct=pct; updateUpRow(i);});
    const id=uid(); await idbPut("files",{id,pid:p.id,name:f.name,size:f.size,type:f.type,blob,addedAt:Date.now()});
    if(ext==="zip"){ p.docs.push({id,name:f.name,size:f.size,ext,kind:"container",addedAt:Date.now(),status:"stored"});
      try{ const z=await JSZip.loadAsync(blob); let n=0; for(const entry of Object.values(z.files)){ if(entry.dir) continue; const nm=entry.name.split("/").pop(); if(!nm||nm.startsWith(".")||entry.name.includes("__MACOSX")) continue; const e2=extOf(nm); if(!ACCEPT.includes(e2)||e2==="zip") continue;
          const b=await entry.async("blob"); const cid=uid(); await idbPut("files",{id:cid,pid:p.id,name:nm,size:b.size,type:"",blob:b,addedAt:Date.now(),parent:id}); p.docs.push({id:cid,name:nm,size:b.size,ext:e2,parent:f.name,addedAt:Date.now(),status:"uploaded"}); n++; }
        u.state=`Unpacked ${n} file(s)`; }catch{ u.state="ZIP could not be opened"; u.bad=true; }
    } else { p.docs.push({id,name:f.name,size:f.size,ext,addedAt:Date.now(),status:"uploaded"}); u.state="Uploaded"; }
    u.pct=100; existing.add(f.name+"|"+f.size); await saveProject(p); render();
  }
  p.stale=true; await saveProject(p); render();
}
function readWithProgress(f,cb){ return new Promise((res,rej)=>{ const r=new FileReader(); r.onprogress=e=>{ if(e.lengthComputable) cb(Math.round(e.loaded/e.total*100)); }; r.onload=()=>res(new Blob([r.result],{type:f.type})); r.onerror=()=>rej(r.error); r.readAsArrayBuffer(f); }); }
function updateUpRow(i){ const el=document.querySelector(`[data-up="${i}"] .pb i`); if(el) el.style.width=S.uploads[i].pct+"%"; }

/* ================= clean file names & folders ================= */
function planFiles(p,c){
  const P=slug(p.name).toUpperCase(); const used=new Set(); const out=[];
  const uniq=(path)=>{ let q=path,n=2; while(used.has(q)){ q=path.replace(/(\.[^.\/]+)$/,`_${n}$1`); n++; } used.add(q); return q; };
  for(const d of c.docs){ if(!d.analysis) { out.push({d,path:uniq(`99_For_Review_Not_Part_of_Submission/${d.name}`),reason:"Not analysed"}); continue; }
    const e=effOf(d); const ext=d.ext||extOf(d.name);
    if(e.match==="no"||d.include===false){ out.push({d,path:uniq(`99_For_Review_Not_Part_of_Submission/${d.name}`),reason:e.match==="no"?"Different product":"Excluded by user"}); continue; }
    if(e.point==="UNCLASSIFIED"){ out.push({d,path:uniq(`99_For_Review_Not_Part_of_Submission/${d.name}`),reason:"Unclassified"}); continue; }
    let folder,base;
    if(e.point==="1.6.1"){ folder=`1.6.1_Product_Label/${e.sub}`; base=`${P}_${SUB_FILE[e.sub]}`; }
    else if(e.point==="1.7.X"){ const r=c.rows.find(r=>r.label===e.other); folder=r?r.folder:`1.7_Additional_Attachments/${slug(e.other)}`; base=`${P}_${slug(e.other)}`; }
    else { const pt=POINTS.find(x=>x.code===e.point); folder=pt.folder;
      if(e.point==="1.6.6") base="Manufacturer_Site_Master_File"+(d.analysis.reference_number?"_"+slug(d.analysis.reference_number):"");
      else if(e.point==="1.6.4") base=(e.formal===false?"GMP_Compliance_Supporting_Letter":"GMP_Certificate")+(d.analysis.reference_number?"_"+slug(d.analysis.reference_number):"");
      else if(e.point==="1.6.2") base=`${P}_Certificate_of_Analysis`+(d.analysis.batch_number?"_Batch_"+slug(d.analysis.batch_number):"");
      else if(e.point==="1.7.3") base=`${P}_`+(/commitment/i.test(d.analysis.document_title||"")&&!/data|report/i.test(d.analysis.document_title||"")?"Stability_Commitment_Letter":"Stability_Data");
      else base=`${P}_${pt.file}`; }
    out.push({d,path:uniq(`${folder}/${base}.${ext}`)}); }
  return out;
}

  for(const x of plan){ const f=fmap[x.d.id]; if(!f) continue; R.file(x.path,f.blob); log+=`Original : ${x.d.name}${x.d.parent?" (from "+x.d.parent+")":""}\nDossier  : ${x.path}\nPoint    : ${x.d.analysis?effOf(x.d).point:"not analysed"}${x.reason?" – "+x.reason:""}\nSHA-256  : ${await sha256(f.blob)}\n\n`; }
  let pend=0; for(const r of c.rows){ if(r.required && !r.files.length && r.folder){ R.file(r.folder+"/PENDING.txt",pendingTxt(r,p)); pend++; } }
  c.rows.filter(r=>r.key==="SUPPORTING").forEach(r=>{ R.file("1.6.4_GMP_Certificate/PENDING.txt",`PENDING DOCUMENT\n\nDossier Point:\n1.6.4\n\nRequired:\nFormal GMP Certificate\n\nStatus:\nOnly a supporting document is available (${r.files.map(f=>f.name).join(", ")}).\n${r.remarks.join("\n")}\n\nAction:\nUpload a formal GMP certificate and regenerate the dossier.\n`); pend++; });
  c.rows.filter(r=>r.key==="OUTDATED"||r.key==="EXPIRED").forEach(r=>R.file((r.folder||"")+"/REVIEW_REQUIRED.txt",`${r.status}: ${r.label}\nFiles: ${r.files.map(f=>f.name).join(", ")}\n${r.remarks.join("\n")}\n\nAction: obtain the current version and regenerate the dossier.\n`));
  if(plan.some(x=>x.path.startsWith("99_"))) R.file("99_For_Review_Not_Part_of_Submission/README.txt",`These files are NOT part of the ${p.name} submission.\n\n`+plan.filter(x=>x.path.startsWith("99_")).map(x=>`- ${x.d.name}: ${x.reason}${x.d.analysis?.product_name_in_document?" (document product: "+x.d.analysis.product_name_in_document+")":""}`).join("\n")+`\n\nRetained for traceability. Remove this folder before submission.\n`);
  R.file("Source_Traceability_Log.txt",log);
  R.file("Reports/Document_Status_Report.csv",reportStatus(p,c)); R.file("Reports/Pending_Documents.csv",reportPending(p,c)); R.file("Reports/Conflict_Report.csv",reportConflicts(p,c)); R.file("Reports/Expiry_Report.csv",reportExpiry(p,c));
  const blob=await z.generateAsync({type:"blob",compression:"DEFLATE"});
  return {blob,docxBlob,pend,c,name:`${root}_FINAL.zip`};
}
async function doGenerate(p,kind){

async function askChat(p,q){
  if(!AI_READY){ toast("AI is not configured on this server."); return; }
  const c=compute(p);
  const ctx={product:p.name,version:p.version,analysed_at:p.analyzedAt?new Date(p.analyzedAt).toISOString():null,today:todayISO(),
    status:c.rows.map(r=>({point:r.code,document:r.label,status:r.status,files:r.files.map(f=>f.name),expiry:r.expiry,remarks:r.remarks})),
    pending:c.pending, conflicts:c.conflicts, validity:c.validity.map(({d,v})=>({doc:d.name,status:v.status,issue:v.issue,expiry:v.expiry,next_review:v.next,note:v.note,left:v.left})),
    form:p.form, ingredients:p.ingredients, observations:p.observations,
    documents:c.docs.map(d=>({file:d.name,point:d.analysis?effOf(d).point:"not analysed",subtype:d.analysis?effOf(d).sub:null,matches_product:d.analysis?effOf(d).match:null,title:d.analysis?.document_title,formal_certificate:d.analysis?.is_formal_certificate,disclaimer:d.analysis?.certificate_disclaimer,authority:d.analysis?.issuing_authority,reference:d.analysis?.reference_number,reason:d.analysis?.classification_reason,issues:d.analysis?.issues}))};
  const RULES=`You are the assistant inside "TBS Dossier Builder". Answer ONLY from the project data below, which was extracted from the user's uploaded documents. If the answer is not in the data, say it is not available in the uploaded documents. Never invent regulatory information and never claim regulatory approval. Be concise; use short lists when helpful; name the files you rely on.\n\nPROJECT DATA:\n`+clipBytes(JSON.stringify(ctx),PROMPT_BUDGET-8000);
  p.chat.push({role:"user",content:q}); p.chat.push({role:"assistant",content:"…",pending:true}); render(); scrollChat();
  const turns=p.chat.filter(m=>!m.pending).slice(-10).map(m=>({role:m.role,content:m.content}));
  while(turns.length && turns[0].role!=="user") turns.shift();
  const last=p.chat[p.chat.length-1];
  try{ const r=await SAMPLE([{role:"user",content:RULES},...turns],{cache:false,modelTier:"default",onText:({text})=>{ last.content=text; const el=document.querySelector(".msg.a:last-child"); if(el) el.textContent=text; scrollChat(); }}); last.content=r.text; }
  catch(e){ last.content=e.text||aiErr(e); }
  delete last.pending; await saveProject(p); render(); scrollChat();
}
function scrollChat(){ const m=document.querySelector(".msgs"); if(m) m.scrollTop=m.scrollHeight; }

document.addEventListener("click",async e=>{
  const n=e.target.closest("[data-nav]"); if(n){ S.view=n.dataset.nav; if(S.view==="new"){ S.newStep=1; S.uploads=[]; S.log=[]; } render(); document.getElementById("main").scrollTop=0; return; }
  const tb=e.target.closest("[data-tab]"); if(tb){ S.tab=tb.dataset.tab; render(); if(S.tab==="Assistant") scrollChat(); return; }
  if(e.target.closest("#drop") && !e.target.closest("input")){ document.getElementById("fileIn").click(); return; }
  if(e.target.id==="menuBtn"){ document.getElementById("side").classList.toggle("open"); return; }
  const a=e.target.closest("[data-act]"); if(!a) return; const act=a.dataset.act; const p=a.dataset.id?S.projects.find(x=>x.id===a.dataset.id)||curP():curP();
  switch(act){
    case "create":{ const nm=(document.getElementById("pname").value||"").trim(); if(!nm){ toast("Enter the product name."); return; }
      const dup=S.projects.find(x=>x.name.toLowerCase()===nm.toLowerCase());
      if(dup && !a.dataset.force){ document.getElementById("dupWarn").innerHTML=`<div class="notice warn">A dossier named “${esc(dup.name)}” already exists (version ${dup.version||0}).<div class="row" style="margin-top:8px"><button class="btn sm primary" data-act="upload-more" data-id="${dup.id}">Add documents to it</button><button class="btn sm" data-act="create" data-force="1">Create new version</button></div></div>`; S.draftName=nm; return; }
      const np=dup? await makeVersionCopy(dup) : newProject(nm); await saveProject(np); S.pid=np.id; S.newStep=2; S.uploads=[]; S.draftName=""; render(); break; }
    case "open": if(!S.running) S.log=[]; S.pid=p.id; S.view="dossier"; S.tab="Overview"; render(); break;
    case "open-tab": S.pid=p.id; S.view="dossier"; S.tab=a.dataset.t; render(); break;
    case "upload-more": S.pid=p.id; S.view="new"; S.newStep=2; S.uploads=[]; render(); break;
    case "analyze": S.pid=p.id; await runAnalysis(p); break;
    case "validate": S.pid=p.id; if(p.docs.some(d=>d.kind!=="container"&&!d.analysis)) await runAnalysis(p); else await revalidate(p); break;
    case "reanalyze":{ const d=p.docs.find(x=>x.id===a.dataset.id); if(d){ d.analysis=null; d.override=null; await saveProject(p); await runAnalysis(p); } break; }
    case "stop": S.running&&S.running.ctl.abort(); break;
    case "zip": await doGenerate(p,"zip"); break;
    case "docx": await doGenerate(p,"docx"); break;
    case "rep": await doReport(p,a.dataset.r); break;
    case "view":{ const d=p.docs.find(x=>x.id===a.dataset.id); if(d) preview(p,d); break; }
    case "dl-orig":{ const rec=await idbGet("files",a.dataset.id); if(rec){ const ok=["pdf","docx","xlsx","jpg","jpeg","png","webp","zip","txt","csv"]; await save(ok.includes(extOf(rec.name))?rec.name:rec.name+".txt",rec.blob); } break; }
    case "close-modal": document.getElementById("modalRoot").innerHTML=""; break;
    case "rm-doc":{ const d=p.docs.find(x=>x.id===a.dataset.id); if(d && confirm(`Remove ${d.name} from this dossier? The file is deleted from this browser.`)){ p.docs=p.docs.filter(x=>x.id!==d.id); await idbDel("files",d.id); p.stale=true; await saveProject(p); render(); } break; }
    case "ing-add": p.ingredients=p.ingredients||[]; p.ingredients.push({name:"",unit:"mg",value:"",proportion_label:"",proportion_unit:"",proportion_value:"",purpose:"",source:"Manual entry"}); p.ingredientsEdited=true; await saveProject(p); render(); break;
    case "ing-del": p.ingredients.splice(+a.dataset.i,1); p.ingredientsEdited=true; await saveProject(p); render(); break;
    case "ing-reset": p.ingredientsEdited=false; await saveProject(p); toast("The next validation will refresh the composition."); render(); break;
    case "add-cat":{ const nm=prompt("Name of the additional document category (e.g. Manufacturing Licence). It will be treated as required."); if(nm&&nm.trim()){ p.custom=p.custom||[]; p.custom.push(nm.trim()); await saveProject(p); render(); } break; }
    case "ask": await askChat(p,a.dataset.q); break;
    case "send":{ const i=document.getElementById("chatIn"); const q=i.value.trim(); if(q){ i.value=""; await askChat(p,q); } break; }
    case "clear-pw": localStorage.removeItem(window.TBS_PW_KEY||"tbs_app_password"); toast("App password cleared – you will be asked again on the next AI request."); break;
    case "clear-chat": p.chat=[]; await saveProject(p); render(); break;
    case "new-version":{ const np=await makeVersionCopy(p); S.pid=np.id; toast("New version created"); render(); break; }
    case "del-project": if(confirm(`Delete dossier “${p.name}” and all its stored files from this browser?`)){ const files=await idbFiles(p.id); for(const f of files) await idbDel("files",f.id); await idbDel("projects",p.id); S.projects=S.projects.filter(x=>x.id!==p.id); S.view="dashboard"; render(); } break;
  }
});
async function makeVersionCopy(p){ const files=await idbFiles(p.id); const np=newProject(p.name); const idmap={};
  for(const f of files){ const nid=uid(); idmap[f.id]=nid; await idbPut("files",{...f,id:nid,pid:np.id,parent:f.parent?idmap[f.parent]||f.parent:undefined}); }
  Object.assign(np,JSON.parse(JSON.stringify({form:p.form||{},formEdited:p.formEdited||{},ingredients:p.ingredients||[],ingredientsEdited:!!p.ingredientsEdited,conflicts:p.conflicts||[],observations:p.observations||[],summary:p.summary||"",custom:p.custom||[],analyzedAt:p.analyzedAt})));
  np.docs=p.docs.map(d=>({...JSON.parse(JSON.stringify(d)),id:idmap[d.id]||d.id})); np.version=(p.version||0)+1; np.versionOf=p.name; np.parent=p.id;
  np.versions=[{n:np.version,date:Date.now(),note:`New version copied from version ${p.version||0}`,docs:np.docs.filter(d=>d.kind!=="container").length,pending:0,warnings:0,progress:0}];
  await saveProject(np); return np; }
async function revalidate(p){ if(!AI_READY){ toast("AI unavailable – showing deterministic checks only."); render(); return; }
  if(S.running) return; const ctl=new AbortController(); S.running={pid:p.id,ctl,done:0,total:0,phase:"Cross-checking documents"}; S.log=["Re-running cross-document validation…"]; render();
  try{ const r=await consolidate(p,ctl.signal); if(r.form) for(const [k,v] of Object.entries(r.form)) if(!p.formEdited[k]) p.form[k]=v; if(Array.isArray(r.ingredients)&&!p.ingredientsEdited) p.ingredients=r.ingredients; p.conflicts=r.conflicts||[]; p.observations=r.observations||[]; p.summary=r.summary||p.summary;
    p.analyzedAt=Date.now(); p.version=(p.version||0)+1; p.stale=true; const c=compute(p); p.versions.push({n:p.version,date:Date.now(),note:"Re-validated",docs:c.docs.length,pending:c.pending.length,warnings:c.warnings,progress:c.progress,snapshot:snapshotOf(p)}); await saveProject(p); toast("Validation complete – version "+p.version); }
  catch(e){ toast(aiErr(e)); } finally{ S.running=null; S.log=[]; render(); } }
document.addEventListener("change",async e=>{
  const t=e.target;
  if(t.id==="fileIn"){ const p=curP(); if(p) await addFiles(p,t.files); t.value=""; return; }
  if(t.dataset.ov){ const p=curP(); const d=p.docs.find(x=>x.id===t.dataset.id); d.override=d.override||{}; d.override[t.dataset.ov]=t.value; if(t.dataset.ov==="match") d.include=t.value!=="no"?true:false; p.stale=true; await saveProject(p); render(); return; }
  if(t.dataset.set){ const k=t.dataset.set; S.settings[k]=t.type==="checkbox"?t.checked:(t.type==="number"?Math.max(0,+t.value||0):t.value); await idbPut("kv",{k:"settings",v:S.settings}); render(); return; }
  if(t.dataset.form){ const p=curP(); const k=t.dataset.form; const old=p.form[k]; p.form[k]={value:t.value,sources:(old&&old.sources)||["Edited by user"]}; p.formEdited[k]=true; p.stale=true; await saveProject(p); return; }
  if(t.dataset.ing!==undefined){ const p=curP(); p.ingredients[+t.dataset.ing][t.dataset.k]=t.value; p.ingredientsEdited=true; p.stale=true; await saveProject(p); return; }
});
document.addEventListener("keydown",e=>{ if(e.key==="Enter"&&e.target.id==="chatIn"){ e.preventDefault(); document.querySelector('[data-act="send"]').click(); }
  if(e.key==="Enter"&&e.target.id==="pname"){ e.preventDefault(); document.querySelector('[data-act="create"]').click(); }
  if((e.key==="Enter"||e.key===" ")&&e.target.id==="drop"){ e.preventDefault(); document.getElementById("fileIn").click(); }
  if(e.key==="Escape") document.getElementById("modalRoot").innerHTML=""; });
document.addEventListener("input",e=>{ if(e.target.id==="pname") S.draftName=e.target.value; });
["dragenter","dragover"].forEach(ev=>document.addEventListener(ev,e=>{ const d=e.target.closest&&e.target.closest("#drop"); if(d){ e.preventDefault(); d.classList.add("over"); } }));
document.addEventListener("dragleave",e=>{ const d=e.target.closest&&e.target.closest("#drop"); if(d) d.classList.remove("over"); });
document.addEventListener("drop",async e=>{ const d=e.target.closest&&e.target.closest("#drop"); if(!d) return; e.preventDefault(); d.classList.remove("over"); const p=curP(); if(p) await addFiles(p,e.dataTransfer.files); });
document.addEventListener("dragover",e=>e.preventDefault());

/* ================= boot ================= */
(async()=>{
  try{ DBH=await openDB(); S.projects=await idbAll("projects"); const st=await idbGet("kv","settings"); if(st&&st.v) S.settings={...S.settings,...st.v}; }
  catch(e){ console.error(e); document.getElementById("view").innerHTML=`<div class="notice bad">Browser storage is unavailable, so dossiers cannot be saved in this view. ${esc(e.message||"")}</div>`; return; }
  S.projects.forEach(p=>p.docs.forEach(d=>{ if(d.status==="analyzing") d.status=d.analysis?"done":"uploaded"; }));
  render();
})();
</script>
</body>
</html>
